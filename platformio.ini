; SK6812 Sniffer — ESP32-H2-DevKitM-1
; Requires pioarduino platform (supports ESP32-H2 with IDF5)
;
; Install pioarduino in VSCode:
;   1. Uninstall PlatformIO IDE extension (if installed)
;   2. Install "pioarduino" extension from VSCode marketplace
;   OR use PlatformIO with custom platform URL below

[platformio]
src_dir = src

[env:esp32-h2-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
board = esp32-h2-devkitm-1

; Use UART port (the CP2102N USB-C port, NOT the native USB port)
; Windows: COM3, COM4, etc.
; macOS:   /dev/cu.usbserial-XXXX
; Linux:   /dev/ttyUSB0
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 921600
monitor_filters = direct

; ESP-IDF sdkconfig overrides
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS=sdkconfig.defaults
